name: render
# Photoreal Cycles renders (Blender 4.2 LTS, CPU) of the GLB scenes in render/scenes/.
# Manual:  Actions -> render -> Run workflow   (or POST /repos/:owner/:repo/actions/workflows/render.yml/dispatches)
#   set      preview | exterior | common | units | all | catalog
#   quality  preview | standard | high            (empty = preview for set=preview, standard otherwise)
#   units    comma list filter (e.g. 1.C,2.A)      packages  comma list (atlantic,lisboa,noir)
#   shots    comma list of shot ids, or panos / stills
#   tod      day | dusk | night (comma list allowed): time of day of the apartment renders (dusk/night = variants of the day image)
#   opts     JSON passed to render_job.py (e.g. {"lamp_boost":5,"ev_bias":0.3})
# Push to render/blender/** renders the small preview set (1.C x lisboa living still + one pano, 2 exterior shots).
# Push that adds / changes render/requests/<name>.json runs the plan with the inputs in that file instead
#   ({set, quality, units, packages, shots, tod, opts, preview, per_shard} or a LIST of such objects -> one run; see plan.py).
#   When a push touches several request files, the last one in name order is used (name them NNN-what.json).
on:
  workflow_dispatch:
    inputs:
      set: { description: 'preview | exterior | common | units | all | catalog', default: 'preview' }
      quality: { description: 'preview | standard | high (empty = auto)', default: '' }
      units: { description: 'unit filter, e.g. 1.C,2.A (empty = all)', default: '' }
      packages: { description: 'package filter, e.g. lisboa (empty = all)', default: '' }
      shots: { description: 'shot ids / panos / stills (empty = all)', default: '' }
      tod: { description: 'interior time of day: day | dusk | night (comma list)', default: 'day' }
      opts: { description: 'JSON options for render_job.py', default: '' }
  push:
    branches: [main]
    paths: ['render/blender/**', 'render/requests/**', '.github/workflows/render.yml']
permissions:
  contents: write
concurrency:
  group: render-${{ github.run_id }}
  cancel-in-progress: false
env:
  BLENDER_URL: https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
  VB_CACHE: /home/runner/.cache/vilnyi-render

jobs:
  catalog:
    if: inputs.set == 'catalog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p render/logs
          curl -s -A "VILNYI-render/1.0" "https://api.polyhaven.com/assets?t=textures" -o /tmp/t.json
          curl -s -A "VILNYI-render/1.0" "https://api.polyhaven.com/assets?t=hdris" -o /tmp/h.json
          python3 - <<'PY'
          import json
          for t, f in [('textures', '/tmp/t.json'), ('hdris', '/tmp/h.json')]:
              d = json.load(open(f))
              with open(f'render/logs/ph_{t}.txt', 'w') as o:
                  for k, v in sorted(d.items()):
                      o.write(f"{k}\t{','.join(v.get('categories', []))}\t{','.join(v.get('tags', []))[:120]}\t{v.get('dimensions', '')}\n")
          PY
          git config user.name "vilnyi-render-bot"; git config user.email "yosmos384@gmail.com"
          git add render/logs && git commit -m "render: polyhaven catalog [skip ci]" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 10 + 3)); done

  plan:
    if: inputs.set != 'catalog'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "render\njs" }
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REQ=""
          if [ "${{ github.event_name }}" = "push" ]; then
            # request files added / changed by this push (GitHub compare API: no git history needed)
            curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}" -o /tmp/compare.json || true
            REQ=$(python3 -c "import json; d=json.load(open('/tmp/compare.json')); print('\n'.join(sorted(f['filename'] for f in d.get('files', []) if f.get('status') != 'removed' and f['filename'].startswith('render/requests/') and f['filename'].endswith('.json'))))" 2>/dev/null | tail -n 1 || true)
            if [ -n "$REQ" ] && [ ! -f "$REQ" ]; then REQ=""; fi
          fi
          if [ -n "$REQ" ]; then
            echo "request file: $REQ"; cat "$REQ"
            python3 render/blender/plan.py --request "$REQ" | tee -a "$GITHUB_OUTPUT"
          else
            python3 render/blender/plan.py --set "${{ inputs.set || 'preview' }}" --quality "${{ inputs.quality }}" \
              --units "${{ inputs.units }}" --packages "${{ inputs.packages }}" --shots "${{ inputs.shots }}" \
              --tod "${{ inputs.tod || 'day' }}" --opts '${{ inputs.opts }}' | tee -a "$GITHUB_OUTPUT"
          fi
      - name: Restore texture/HDRI cache
        id: texcache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VB_CACHE }}
          key: vbtex-${{ hashFiles('render/blender/vb_library.py') }}
          restore-keys: vbtex-
      - name: Prefetch CC0 textures + HDRIs (Poly Haven)
        if: steps.texcache.outputs.cache-hit != 'true'
        run: python3 render/blender/vb_assets.py prefetch --res 2k --hdri-res 4k
      - name: Save texture/HDRI cache
        if: steps.texcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VB_CACHE }}
          key: vbtex-${{ hashFiles('render/blender/vb_library.py') }}

  render:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "render\njs\n.github", fetch-depth: 1 }
      - name: Restore Blender
        id: bcache
        uses: actions/cache@v4
        with: { path: /home/runner/blender, key: blender-4.2.3-linux-x64 }
      - name: Install Blender 4.2.3
        if: steps.bcache.outputs.cache-hit != 'true'
        run: |
          curl -sL "$BLENDER_URL" -o /tmp/b.tar.xz && mkdir -p /home/runner/blender
          tar -xf /tmp/b.tar.xz -C /home/runner/blender --strip-components=1
      - name: Restore texture/HDRI cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VB_CACHE }}
          key: vbtex-${{ hashFiles('render/blender/vb_library.py') }}
          restore-keys: vbtex-
      - name: System libs
        run: sudo apt-get install -y -qq libxi6 libxkbcommon0 libsm6 libgl1 >/dev/null 2>&1 || true
      - name: Render ${{ matrix.name }}
        run: |
          echo '${{ matrix.job }}' > /tmp/job.json
          nproc; free -g | head -2
          /home/runner/blender/blender --version | head -1
          set -o pipefail
          /home/runner/blender/blender -b -noaudio --python render/blender/render_job.py -- --job /tmp/job.json 2>&1 | tee /tmp/blender.log | grep -E "^\[|Error|Traceback|SHOT|DONE|FAILED" || true
      - name: Commit outputs
        if: always()
        run: |
          mkdir -p render/logs
          tail -n 60 /tmp/blender.log > "render/logs/${{ matrix.name }}.blender-tail.txt" 2>/dev/null || true
          git config user.name "vilnyi-render-bot"; git config user.email "yosmos384@gmail.com"
          git add --sparse -A renders render/logs || git add -A renders render/logs || true
          git commit -q -m "render: ${{ matrix.name }} [skip ci]" || { echo "nothing to commit"; exit 0; }
          for i in $(seq 1 15); do
            git pull --rebase --autostash -q -X theirs && git push -q && { echo "pushed (try $i)"; exit 0; }
            sleep $((RANDOM % 20 + 5))
          done
          echo "push failed"; exit 1

  manifest:
    needs: [plan, render]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build renders/manifest.json
        run: |
          git pull -q --rebase || true
          python3 render/blender/manifest.py
          git config user.name "vilnyi-render-bot"; git config user.email "yosmos384@gmail.com"
          git add renders/manifest.json && git commit -q -m "render: manifest [skip ci]" || exit 0
          for i in $(seq 1 10); do git pull --rebase --autostash -q && git push -q && exit 0; sleep $((RANDOM % 15 + 5)); done
