name: assets
# Downloads CC0 PBR textures / HDRIs / glTF models (Poly Haven, ambientCG) -> web versions committed under assets/,
# 2K/4K masters kept only in the actions cache. Mode is set in render/assets/request.json (catalog | thumbs | build).
on:
  workflow_dispatch:
  push:
    paths: ['render/assets/fetch.py', 'render/assets/request.json', 'render/assets/selection.json', '.github/workflows/assets.yml']
permissions:
  contents: write
concurrency:
  group: assets
  cancel-in-progress: false
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install tools
        run: |
          pip install -q pillow numpy
          npm i -g --silent @gltf-transform/cli@4 || npm i -g @gltf-transform/cli
          gltf-transform --version || true
      - name: Restore 2K/4K master cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vilnyi-assets
          key: vilnyi-assets-${{ hashFiles('render/assets/selection.json') }}
          restore-keys: vilnyi-assets-
      - name: Fetch
        run: python render/assets/fetch.py
      - name: Sizes
        run: |
          du -sh assets/pbr assets/hdri assets/models 2>/dev/null | tee -a render/logs/assets.txt || true
          du -sh ~/.cache/vilnyi-assets | tee -a render/logs/assets.txt || true
      - name: Commit (only our paths, rebased onto latest main)
        run: |
          git config user.name "vilnyi-assets-bot"; git config user.email "yosmos384@gmail.com"
          MODE=$(python -c "import json;print(json.load(open('render/assets/request.json')).get('mode','build'))")
          OUT=$RUNNER_TEMP/out; mkdir -p $OUT
          PATHS="render/logs/assets.txt render/logs/contact-*.jpg render/logs/hdri-*.jpg render/assets/catalog render/assets/blender_manifest.json assets/pbr assets/hdri assets/models assets/manifest.json"
          for p in $PATHS; do [ -e "$p" ] && cp -r --parents $p $OUT/ || true; done
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main && git reset -q --hard origin/main
            if [ "$MODE" = build ]; then rm -rf assets/pbr assets/hdri assets/models; fi
            cp -r $OUT/. .
            git add -A $PATHS 2>/dev/null; git add -A render/logs render/assets assets/pbr assets/hdri assets/models assets/manifest.json 2>/dev/null || true
            git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
            git commit -q -m "assets: $MODE [skip ci]"
            git push -q origin HEAD:main && { echo "pushed"; exit 0; }
            sleep $((i*5))
          done
          echo "PUSH FAILED"; exit 1
